spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.catalog-impl=org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.iceberg.uri=http://nessie:19120/api/v2
spark.sql.catalog.iceberg.ref=main
spark.sql.catalog.iceberg.warehouse=s3a://warehouse/
spark.sql.catalog.iceberg.s3.endpoint=http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access=true
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin123
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false
# Jar Iceberg/Nessie/hadoop-aws có sẵn trong image docker/spark/Dockerfile (không dùng spark.jars.packages).
spark.jars=/opt/spark/jars/ojdbc11.jar
spark.sql.sources.partitionOverwriteMode=dynamic
spark.sql.catalog.oracle=org.apache.spark.sql.execution.datasources.v2.jdbc.JDBCTableCatalog
spark.sql.catalog.oracle.url=jdbc:oracle:thin:@//192.168.26.180:1521/DBPDB
spark.sql.catalog.oracle.driver=oracle.jdbc.OracleDriver
spark.sql.catalog.oracle.user=PG_MIS
spark.sql.catalog.oracle.password=PG_MIS
spark.sql.catalog.oracle.fetchsize=10000
# Bảng do Trino tạo lưu đường dẫn s3:// -> đọc bằng S3A như s3a://
spark.hadoop.fs.s3.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
