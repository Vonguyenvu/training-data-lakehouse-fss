version: 2

# Nguồn Oracle đọc qua catalog JDBC `oracle` của Spark (conf/spark/spark-defaults.conf).
# dbt-spark không cho đặt `database` -> ghi catalog vào schema: oracle.<SCHEMA>.<TABLE>.

sources:
  - name: oracle_ebanking
    description: "Oracle PG_EBANKING"
    schema: oracle.PG_EBANKING
    quoting:
      schema: false
      identifier: false
    tables:
      - name: COL_UDF_VALUE
        description: "-> pg_bronze.ebanking_col_udf_value"
  - name: oracle_flexbo
    description: "Oracle PG_FLEXBO"
    schema: oracle.PG_FLEXBO
    quoting:
      schema: false
      identifier: false
    tables:
      - name: PGBLD_CONTRACT_UDFIELD_HIST
        description: "-> pg_bronze.flexbo_pgbld_contract_udfield_hist"
      - name: PGBLD_RT_CONTRACT_UDFIELD_HIST
        description: "-> pg_bronze.flexbo_pgbld_rt_contract_udfield_hist"
      - name: PGB_CONTRACT_UDF_MAP
        description: "-> pg_bronze.flexbo_pgb_contract_udf_map"
      - name: PGB_LDTB_CONTRACT_MASTER
        description: "-> pg_bronze.flexbo_pgb_ldtb_contract_master"
      - name: PGB_LOS_CONTRACT_FIELDS_TDATE
        description: "-> pg_bronze.flexbo_pgb_los_contract_fields_tdate"
  - name: oracle_los_app
    description: "Oracle PG_LOS_APP"
    schema: oracle.PG_LOS_APP
    quoting:
      schema: false
      identifier: false
    tables:
      - name: FACILITY
        description: "-> pg_bronze.los_app_facility"
      - name: LOAN_DISBURSEMENT
        description: "-> pg_bronze.los_app_loan_disbursement"
      - name: PRODUCT
        description: "-> pg_bronze.los_app_product"
  - name: oracle_smy
    description: "Oracle PG_SMY"
    schema: oracle.PG_SMY
    quoting:
      schema: false
      identifier: false
    tables:
      - name: STMT_ENTRY_LOAN_GRA
        description: "-> pg_bronze.smy_stmt_daily"
  - name: oracle_source
    description: "Oracle PG_SOURCE"
    schema: oracle.PG_SOURCE
    quoting:
      schema: false
      identifier: false
    tables:
      - name: SAOKE_CRB
        description: "-> pg_bronze.source_saoke_crb"
      - name: SAOKE_MVMT
        description: "-> pg_bronze.source_saoke_mvmt"
  - name: oracle_t24core
    description: "Oracle PG_T24CORE"
    schema: oracle.PG_T24CORE
    quoting:
      schema: false
      identifier: false
    tables:
      - name: COMPANY
        description: "-> pg_bronze.t24core_company"
      - name: CURRENCY
        description: "-> pg_bronze.t24core_currency"
      - name: CURRENCY_HIS
        description: "-> pg_bronze.t24core_currency_his"
      - name: CUSTOMER
        description: "-> pg_bronze.t24core_customer"
      - name: DEPT_ACCT_OFFICER
        description: "-> pg_bronze.t24core_dept_acct_officer"
      - name: LD_LOANS_AND_DEPOSITS
        description: "-> pg_bronze.t24core_ld_loans_and_deposits"
      - name: LD_LOANS_AND_DEPOSITS_HIS
        description: "-> pg_bronze.t24core_ld_loans_and_deposits_his"
      - name: LD_SCHEDULE_DEFINE_MV
        description: "-> pg_bronze.t24core_ld_schedule_define_mv"
      - name: LIMIT
        description: "-> pg_bronze.t24core_limit"
      - name: MB_MG_SAVING_MULTI
        description: "-> pg_bronze.t24core_mb_mg_saving_multi"
      - name: PD_PAYMENT_DUE
        description: "-> pg_bronze.t24core_pd_payment_due"
      - name: PD_PAYMENT_DUE_HIS
        description: "-> pg_bronze.t24core_pd_payment_due_his"
      - name: PD_PAYMENT_DUE_HIS_MV
        description: "-> pg_bronze.t24core_pd_payment_due_his_mv"
      - name: PD_PAYMENT_DUE_MV
        description: "-> pg_bronze.t24core_pd_payment_due_mv"
      - name: SECTOR
        description: "-> pg_bronze.t24core_sector"
      - name: STMT_ENTRY
        description: "-> pg_bronze.t24core_stmt_entry"
