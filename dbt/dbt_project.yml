name: fss_training
version: "1.0.0"
config-version: 2

profile: fss_training

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  fss_training:
    +materialized: table
    # Catalog Iceberg trên Nessie không hỗ trợ VIEW: incremental dùng bảng tạm thay cho view tạm.
    +views_enabled: false
    +persist_docs:
      relation: true
      columns: true
    silver_temp1:
      +tags: ["silver", "silver_temp1"]
      +pre-hook: "{{ scd_backdate() }}"   # chặn / tua bảng SCD khi chạy ETL_DATE cũ (macros/scd_backdate.sql)
    silver_temp2:
      +tags: ["silver", "silver_temp2"]
      +pre-hook: "{{ scd_backdate() }}"
    gold:
      +schema: pg_gold
      +tags: ["gold"]
