name: fss_training
version: "1.0.0"
config-version: 2

profile: fss_training

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  fss_training:
    +materialized: table
    # Engine Spark (Thrift Server), catalog mặc định iceberg (Nessie). Nessie không hỗ trợ VIEW lâu dài;
    # incremental của dbt-spark chỉ dùng temporary view trong phiên -> không ảnh hưởng.
    +file_format: iceberg
    +persist_docs:
      relation: true
      columns: true
    bronze:
      # Mirror Oracle 1:1; chạy lại cùng ETL_DATE chỉ ghi đè partition đó (partitionOverwriteMode=dynamic).
      +schema: pg_bronze
      +tags: ["bronze"]
      +materialized: incremental
      +incremental_strategy: insert_overwrite
      +partition_by: ["ETL_DATE"]
      +on_schema_change: fail
    silver_temp1:
      +tags: ["silver", "silver_temp1"]
      +pre-hook: "{{ scd_backdate() }}"   # chặn / tua bảng SCD khi chạy ETL_DATE cũ (macros/scd_backdate.sql)
    silver_temp2:
      +tags: ["silver", "silver_temp2"]
      +pre-hook: "{{ scd_backdate() }}"
    gold:
      +schema: pg_gold
      +tags: ["gold"]
