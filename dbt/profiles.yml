fss_training:
  target: dev
  outputs:
    dev:
      # Spark Thrift Server, spark.sql.defaultCatalog=iceberg -> schema pg_silver = iceberg.pg_silver
      type: spark
      method: thrift
      host: spark-thrift
      port: 10000
      user: dbt
      schema: pg_silver
      threads: 1
      connect_retries: 5
      connect_timeout: 10
